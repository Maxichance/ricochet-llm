<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ricochet</title>
<meta name="description" content="Status and quotas of free LLM providers, with a test console.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 256 256%22%3E%3Cdefs%3E%3CclipPath id=%22rc%22%3E%3Crect x=%2210%22 y=%2210%22 width=%22236%22 height=%22236%22/%3E%3C/clipPath%3E%3C/defs%3E%3Cg clip-path=%22url(%23rc)%22%3E%3Cpath d=%22M50 80 L96 232%22 fill=%22none%22 stroke=%22%231d3a8a%22 stroke-width=%2220%22 stroke-dasharray=%2228 22%22/%3E%3Cpath d=%22M96 232 L158 26 L195 150%22 fill=%22none%22 stroke=%22%231d3a8a%22 stroke-width=%2220%22 stroke-linejoin=%22miter%22/%3E%3Ccircle cx=%22196%22 cy=%22154%22 r=%2228%22 fill=%22%231d3a8a%22/%3E%3C/g%3E%3Crect x=%2220%22 y=%2220%22 width=%22216%22 height=%22216%22 fill=%22none%22 stroke=%22%231d3a8a%22 stroke-width=%2220%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 256 256" width="30" height="30" aria-hidden="true"><defs><clipPath id="rc"><rect x="10" y="10" width="236" height="236"/></clipPath></defs><g clip-path="url(#rc)"><path d="M50 80 L96 232" fill="none" stroke="currentColor" stroke-width="20" stroke-dasharray="28 22"/><path d="M96 232 L158 26 L195 150" fill="none" stroke="currentColor" stroke-width="20" stroke-linejoin="miter"/><circle cx="196" cy="154" r="28" fill="currentColor"/></g><rect x="20" y="20" width="216" height="216" fill="none" stroke="currentColor" stroke-width="20"/></svg>
    <h1>Ricochet</h1>
  </div>
  <div class="top-right">
    <span class="live" id="live" data-state="off" role="status" aria-live="polite"><i class="shape circle"></i><span id="live-text">connecting…</span></span>
    <button class="btn" id="refresh" type="button">Refresh</button>
  </div>
</header>

<main>
  <section class="next" id="summary" aria-label="Summary"></section>

  <section aria-labelledby="h-providers">
    <h2 id="h-providers" class="eyebrow">Providers</h2>
    <div class="rows" id="rows"></div>
  </section>

  <div class="split">
    <section aria-labelledby="h-chat" class="chat">
      <div class="head">
        <h2 id="h-chat" class="eyebrow">Console</h2>
        <button class="btn quiet" id="new-chat" type="button">New chat</button>
      </div>
      <div class="msgs" id="msgs" role="log" aria-live="polite" aria-relevant="additions"></div>
      <form class="composer" id="composer">
        <label class="sr" for="input">Message</label>
        <textarea id="input" rows="2" maxlength="8000" placeholder="Write a message — Enter to send"></textarea>
        <button class="btn solid" id="send" type="submit">Send</button>
      </form>
    </section>

    <section aria-labelledby="h-log" class="log">
      <div class="head"><h2 id="h-log" class="eyebrow">Log</h2></div>
      <ul class="events" id="events"></ul>
    </section>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js" defer></script>
</body>
</html>
