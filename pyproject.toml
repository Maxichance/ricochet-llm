[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ricochet-llm"
version = "0.5.0"
description = "Multi-provider free-tier LLM router with automatic failover and a dashboard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "router", "failover", "free-tier", "openai-compatible", "web-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
server = ["fastapi", "uvicorn"]          # web dashboard: pip install ricochet-llm[server]
dev = ["httpx", "fastapi", "uvicorn"]

[project.urls]
Homepage = "https://github.com/Maxichance/ricochet-llm"
Documentation = "https://github.com/Maxichance/ricochet-llm/blob/main/docs/GUIDE.md"
Changelog = "https://github.com/Maxichance/ricochet-llm/blob/main/CHANGELOG.md"
Issues = "https://github.com/Maxichance/ricochet-llm/issues"

[project.scripts]
ricochet-llm = "ricochet_llm.__main__:main"

[tool.setuptools]
packages = ["ricochet_llm"]

[tool.setuptools.package-data]
ricochet_llm = ["web/*", "py.typed"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]          # long data tables and accented strings sometimes exceed the limit: we favor readability

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]       # sys.path is adjusted before the package imports
