[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ricochet-llm"
version = "0.5.0"
description = "Routeur LLM multi-providers free tier avec bascule automatique et tableau de bord"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "router", "failover", "free-tier", "openai-compatible", "web-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
server = ["fastapi", "uvicorn"]          # tableau de bord web : pip install ricochet-llm[server]
dev = ["httpx", "fastapi", "uvicorn"]

[project.urls]
Homepage = "https://github.com/Maxichance/ricochet-llm"
Issues = "https://github.com/Maxichance/ricochet-llm/issues"

[project.scripts]
ricochet-llm = "ricochet_llm.__main__:main"

[tool.setuptools]
packages = ["ricochet_llm"]

[tool.setuptools.package-data]
ricochet_llm = ["web/*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]          # le français accentué et les tableaux de données dépassent parfois : on garde la lisibilité

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]       # sys.path est ajusté avant les imports du paquet
